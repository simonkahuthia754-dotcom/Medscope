name: debug
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with: {python-version: "3.11", channels: "conda-forge", channel-priority: strict}
      - name: install
        shell: bash -el {0}
        run: |
          conda install -y rdkit vina openbabel || true
          pip install gemmi meeko || true
      - name: debug
        shell: bash -el {0}
        run: python ci_debug.py
