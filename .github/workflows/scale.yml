name: scale
on:
  workflow_dispatch:
    inputs:
      limit: {default: '400000'}
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with: {python-version: "3.11", channels: "conda-forge", channel-priority: strict}
      - shell: bash -el {0}
        run: |
          pip install rdkit admet-ai scikit-learn || true
          python -c "import admet; print('ADMET-AI available:', admet.HAVE, getattr(admet, 'ERR', ''))"
      - shell: bash -el {0}
        run: |
          python screen.py all --limit ${{ github.event.inputs.limit }} --top 8 2>&1 | tail -150
          python evolve.py lung-cancer --gens 6 2>&1 | tail -30
